name: Deploy Worker

on:

  push:

    branches:

      - main

jobs:

  deploy:

    runs-on: ubuntu-latest

    timeout-minutes: 60

    steps:

      - name: Check out repository

        uses: actions/checkout@v6

      - name: Deploy Worker

        uses: cloudflare/wrangler-action@v3

        with:

          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}

          accountId: a6a10398c1de561c59f5c2deac950806
